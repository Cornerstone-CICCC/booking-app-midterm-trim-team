name: Mirror to personal repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Push main to personal repo
        env:
          TOKEN: ${{ secrets.PERSONAL_REPO_TOKEN }}
          OWNER: ${{ vars.MIRROR_OWNER }}
          REPO: ${{ vars.MIRROR_REPO }}
        run: |
          git push --force \
          "https://x-access-token:${TOKEN}@github.com/${OWNER}/${REPO}.git" \
          HEAD:main
